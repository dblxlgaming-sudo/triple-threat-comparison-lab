<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Triple Threat · Comparison Lab</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Triple Threat home"><span class="tt">TT</span><strong>TRIPLE THREAT</strong></a>
      <nav class="primary-nav" aria-label="Primary">
        <a href="#">⌂ <span>Home</span></a>

    <main>

  <template id="pill-template"><button class="pill" type="button"></button></template>
